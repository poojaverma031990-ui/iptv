<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BharatStream IPTV Pro - Country Live TV</title>
  <meta name="description" content="Ultra-fast Country IPTV Web Player optimized for Android TV and mobile with native remote control support.">
  <meta name="theme-color" content="#080b11">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- HLS.js with fallback for modern browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Slim Header -->
  <header>
    <a href="#" class="logo" tabindex="0" id="logo-link">
      <div class="logo-icon">
        <img src="IMG_6212.png" alt="Logo" style="width:100%;height:100%;object-fit:cover;border-radius:7px;" onerror="this.style.display='none';">
        <i class="fa-solid fa-play" id="logo-fallback-icon" style="display:none;"></i>
      </div>
      <span>IPTV<span style="color: #00f2fe;">GLOBAL</span></span>
      <span class="logo-badge" id="header-region-badge">INDIA</span>
    </a>

    <div class="nav-actions">
      <button class="btn" id="btn-load-m3u" tabindex="0">
        <i class="fa-solid fa-file-import"></i>
        <span class="btn-label-text">Custom M3U</span>
      </button>
      <button class="btn btn-primary" id="btn-refresh" tabindex="0">
        <i class="fa-solid fa-arrows-rotate"></i>
        <span class="btn-label-text">Reload</span>
      </button>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="app-container">
    
    <!-- Video Player Section -->
    <div class="player-section">
      <div class="video-frame-wrap" id="video-wrapper">
        <video id="main-player" playsinline webkit-playsinline preload="auto"></video>
        
        <div class="overlay-top-badge">
          <i class="fa-solid fa-circle" style="font-size: 0.5rem;"></i> <span id="live-badge-text">LIVE INDIA</span>
        </div>

        <!-- Controls Bar -->
        <div class="player-overlay" id="player-overlay">
          <div>
            <button class="ctrl-btn" id="btn-play-pause" title="Play/Pause" tabindex="0">
              <i class="fa-solid fa-play"></i>
            </button>
            <button class="ctrl-btn" id="btn-mute" title="Mute/Unmute" tabindex="0">
              <i class="fa-solid fa-volume-high"></i>
            </button>
            <input type="range" class="volume-slider" id="volume-bar" min="0" max="1" step="0.05" value="1" tabindex="0">
          </div>
          <div>
            <button class="ctrl-btn" id="btn-pip" title="Picture in Picture" tabindex="0">
              <i class="fa-solid fa-images"></i>
            </button>
            <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen" tabindex="0">
              <i class="fa-solid fa-expand" id="fullscreen-icon"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Channel Meta -->
      <div class="player-meta-card">
        <div class="channel-info-main">
          <div class="active-logo-wrap" id="active-logo-container">
            <div class="active-monogram" id="current-ch-monogram"><i class="fa-solid fa-tv"></i></div>
            <img id="current-ch-logo" src="" alt="" class="active-logo" referrerpolicy="no-referrer" style="display:none;">
          </div>
          <div class="active-details">
            <h2 id="current-ch-title">Loading Channel...</h2>
            <p style="font-size: 0.78rem; color: #94a3b8;">
              <span class="tag-category" id="current-ch-cat">GENERAL</span>
              <span id="current-ch-source" style="margin-left: 0.4rem;">IPTV Streams</span>
            </p>
          </div>
        </div>
        <div>
          <button class="btn btn-primary" id="btn-external-player" tabindex="0">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span>Open External</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Channels Sidebar -->
    <div class="sidebar-panel">
      <div class="sidebar-header">
        
        <!-- Country Selector Dropdown without Whole World -->
        <div class="country-select-container">
          <select id="country-dropdown" class="country-dropdown" tabindex="0">
            <option value="https://iptv-org.github.io/iptv/countries/in.m3u" selected>🇮🇳 India (Default)</option>
            <option value="https://iptv-org.github.io/iptv/countries/us.m3u">🇺🇸 United States</option>
            <option value="https://iptv-org.github.io/iptv/countries/gb.m3u">🇬🇧 United Kingdom</option>
            <option value="https://iptv-org.github.io/iptv/countries/ca.m3u">🇨🇦 Canada</option>
            <option value="https://iptv-org.github.io/iptv/countries/au.m3u">🇦🇺 Australia</option>
            <option value="https://iptv-org.github.io/iptv/countries/de.m3u">🇩🇪 Germany</option>
            <option value="https://iptv-org.github.io/iptv/countries/fr.m3u">🇫🇷 France</option>
            <option value="https://iptv-org.github.io/iptv/countries/jp.m3u">🇯🇵 Japan</option>
            <option value="https://iptv-org.github.io/iptv/countries/br.m3u">🇧🇷 Brazil</option>
            <option value="https://iptv-org.github.io/iptv/countries/es.m3u">🇪🇸 Spain</option>
            <option value="https://iptv-org.github.io/iptv/countries/it.m3u">🇮🇹 Italy</option>
            <option value="https://iptv-org.github.io/iptv/countries/kr.m3u">🇰🇷 South Korea</option>
            <option value="https://iptv-org.github.io/iptv/index.m3u">🌐 Full IPTV-Org Index</option>
          </select>
        </div>

        <div class="playlist-status-bar">
          <span id="playlist-name">India Channels</span>
          <span id="channel-count-display">0 channels</span>
        </div>

        <div class="search-box">
          <input type="text" class="search-input" id="search-input" placeholder="Search channels..." tabindex="0">
        </div>

        <div class="categories-scroll" id="category-tabs">
          <button class="cat-tab active" data-cat="all" tabindex="0">All Channels</button>
          <button class="cat-tab" data-cat="entertainment" tabindex="0">Entertainment</button>
          <button class="cat-tab" data-cat="news" tabindex="0">News</button>
          <button class="cat-tab" data-cat="movies" tabindex="0">Movies</button>
          <button class="cat-tab" data-cat="sports" tabindex="0">Sports</button>
          <button class="cat-tab" data-cat="kids" tabindex="0">Kids</button>
          <button class="cat-tab" data-cat="music" tabindex="0">Music</button>
        </div>
      </div>

      <!-- Infinite scroll list -->
      <div class="channel-list" id="channel-list">
        <!-- Dynamic cards -->
      </div>

      <div class="loading-overlay" id="loading-overlay">
        <div id="loading-msg">Syncing streams...</div>
      </div>
    </div>

  </div>

  <!-- Custom Playlist Modal -->
  <div class="modal-overlay" id="modal-m3u">
    <div class="modal-card">
      <h3 style="margin-bottom: 0.8rem;">IPTV M3U Playlist</h3>
      <input type="text" class="search-input" id="m3u-url-input" value="https://iptv-org.github.io/iptv/countries/in.m3u" style="margin-bottom: 0.8rem;" tabindex="0">
      <div style="text-align: right;">
        <button class="btn" id="btn-cancel-modal" tabindex="0">Cancel</button>
        <button class="btn btn-primary" id="btn-submit-m3u" tabindex="0">Load Playlist</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast-msg"></div>

  <script src="script.js"></script>
</body>
</html>
